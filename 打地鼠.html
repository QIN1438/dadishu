<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-image: url(./bg.jpg);
        background-color: #48b7d6;
      }
      h3 {
        text-indent: 80px;
        font-size: 50px;
        color: rgb(236, 146, 28);
        letter-spacing: 15px;
        margin-top: 100px;
      }
      .main {
        width: 600px;
        height: 600px;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        grid-template-columns: 200px 200px 200px;
        grid-template-rows: 200px 200px 200px;
      }
      .item {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .item img {
        display: none;
        width: 100%;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        top: 250;
        left: 303;
      }
      .item .mouse {
        width: 55%;
      }
      .item .hole {
        display: block;
      }
      .item .cursor-down {
        display: none;
         width: 60%;
         position: absolute;
         left: 60%;
         top: 15%;
      }
    </style>
  </head>
  <body>
    <h3>积分：<span class="score">0</span></h3>
    <div class="main">
      <div class="item">

<script>
  var mouseLists = document.querySelectorAll(".mouse");
  var scoreBox=document.querySelector(".score");
  // 积分
  var score=0;
  for (var i = 0; i < mouseLists.length; i++) {
    // 绑定点击事件
    mouseLists[i].addEventListener("click", function () {
      this.style.display = "none";
      this.parentElement.lastElementChild.style.display = "block";
      var that = this;
      // 点击后，增加积分
      score += 10;
      var timer = setTimeout(function () {
        clearTimeout(timer);
        timer=null;
        that.parentElement.lastElementChild.style.display = "none";
      }, 260);
      // 点击后，更新积分
      scoreBox.textContent=score;
    });
  }
  setInterval(function () {
    var i = Math.floor(Math.random() * 9);
    mouseLists[i].style.display = "block";
  }, 1000);
</script>
